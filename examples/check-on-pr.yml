name: README drift check
on:
  pull_request:
    paths: ['**/*.src.md', '**/*.md']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nanolaba/nrg-action@18c37a356bcde3a6ced8fa9e6fea173b1de5c460  # v1
        with:
          file: README.src.md
          mode: check
          nrg-version: '1.4'
