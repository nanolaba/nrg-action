name: Regenerate README
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nanolaba/nrg-action@18c37a356bcde3a6ced8fa9e6fea173b1de5c460  # v1
        with:
          file: README.src.md
          nrg-version: '1.4'
