name: Regenerate README
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nanolaba/nrg-action@3d8a5fc7b76f259122c3175058231a1b893c5b4a  # v1
        with:
          file: README.src.md
          nrg-version: '1.3'
